<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IFA 2026 第二天现场 APP</title>
<style>
html,body{margin:0;height:100%;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}
.topbar{position:fixed;left:0;right:0;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid #dfe4ea;padding:8px 10px calc(8px + env(safe-area-inset-top));display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.title{font-weight:900;color:#17202a;font-size:14px;line-height:1.25}.sub{font-size:11px;color:#667085;margin-top:2px}
button{border:0;border-radius:11px;background:#16a34a;color:white;font-weight:900;font-size:14px;padding:11px 13px;white-space:nowrap}
iframe{position:fixed;left:0;right:0;bottom:0;top:70px;width:100%;height:calc(100% - 70px);border:0;background:#fff}
@media(max-width:480px){.title{font-size:13px}.sub{font-size:10px}button{font-size:13px;padding:10px 11px}iframe{top:72px;height:calc(100% - 72px)}}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="title">IFA 2026 · 第二天现场 APP</div><div class="sub">随时导出 JSON，后续与第一天数据合并</div></div>
  <button id="backupBtn">⬇️ 导出数据</button>
</div>
<iframe id="appFrame" src="IFA2026_Day2_手机现场APP_完整版.html" title="IFA 2026 Day 2"></iframe>
<script>
document.getElementById('backupBtn').addEventListener('click',()=>{
  try{
    const f=document.getElementById('appFrame');
    const d=f.contentDocument||f.contentWindow.document;
    const btn=d.getElementById('exportBackup')||d.getElementById('quickExport');
    if(btn){btn.click();return;}
    alert('页面还在加载，请稍等几秒后再点“导出数据”。');
  }catch(e){alert('暂时无法导出，请刷新页面后重试。');}
});
</script>
</body>
</html>
